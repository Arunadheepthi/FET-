<html>
<head>
<title>Swapping of Two numbers</title>
</head>
<body>
<script>
document.write("javascript" + "<br>");
var a=10;
var b=20
document.write("a is:" + a + "<br>")
document.write("b is:" + b + "<br>")
var swap =a;
var a=b;
var b=swap;
document.write("Swapped a:"+ a + " <br>"+ "Swapped b:" + b);
</script>
</body>
